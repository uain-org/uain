# BAINK nginx site for baink.money, as installed on the BAINK host (15 November 2026).
# It is the live file (sha256 064747bd...) plus two changes (IN-8, LV-2): server_tokens off in
# each of BAINK's server blocks (not at http level: other sites share this nginx), and HSTS on
# the www redirect (the BAINK server sends it on baink.money itself). Install: docs/security/baink-host-work-2026-11-15.md.

limit_req_zone $binary_remote_addr zone=baink_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name baink.money www.baink.money;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://baink.money$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.baink.money;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/baink.money/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baink.money/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://baink.money$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name baink.money;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/baink.money/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baink.money/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /MCP { rewrite ^ /mcp last; }
    location = /mcp {
        limit_req zone=baink_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8798;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # BAINK wallet routing v1: narrow body bounds, existing rate zone.
    location ^~ /api/native/review {
        limit_req zone=baink_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8798;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 128k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
    }
    # BAINK exact payment list: preserve authentication without slash redirect.
    location = /api/native/payments {
        limit_req zone=baink_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8798;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
    }
    location ^~ /api/native/payments/ {
        location ~ "^/api/native/payments/[a-f0-9-]{36}/(submit|recover)$" {
        limit_req zone=baink_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8798;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 32k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
        }
        limit_req zone=baink_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8798;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
    }

    # 9 Nov 2026: the Docker holder installer page and its OCI image registry are
    # retired (no-install only). Releases stay on disk, unserved.
    location = /wallet { return 410; }
    location ^~ /wallet/ { return 410; }
    location ^~ /v2/ { return 410; }

    location ^~ /api/ {
        limit_req zone=baink_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8798;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location / {
        proxy_pass http://127.0.0.1:8798;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
