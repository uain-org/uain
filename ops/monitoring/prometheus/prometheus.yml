global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerts are Grafana's (ops/monitoring/grafana/provisioning/alerting).

scrape_configs:
  # Every pilot copy. The service name resolves to all of them on the app's
  # network, so scaling the copies needs no change here.
  - job_name: pilot
    dns_sd_configs:
      - names: [pilot]
        type: A
        port: 9464
        refresh_interval: 15s

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Public pages and the API, fetched from outside the app the way a visitor
  # would, through DNS, TLS and the shared front door.
  - job_name: site
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://uain.global/
          - https://uain.global/api/ready
          - https://uain.global/waitlist
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
