# The site-wide security headers (13 November 2026). Each is added only when the
# connection server did not send that header itself: its own pages carry their
# own Content-Security-Policy, Referrer-Policy and X-Content-Type-Options, and a
# second copy would be doubled or would loosen the stricter one. An empty value
# makes add_header skip the header, so for files nginx serves itself (nothing
# upstream) every header is added. HSTS is not here: the front door sends it
# (deploy/k8s/production/front-door.conf), and a copy here showed twice on /mcp
# and /api/stream. nginx drops inherited add_header lines in any block that has
# its own, so the set is repeated in every such location below; a test
# (services/pilot/test/web-proxy-headers.test.mjs) fails when one is missed.
map $upstream_http_x_content_type_options $sec_xcto {
    default "";
    ""      "nosniff";
}
map $upstream_http_x_frame_options $sec_xfo {
    default "";
    ""      "DENY";
}
map $upstream_http_referrer_policy $sec_referrer {
    default "";
    ""      "strict-origin-when-cross-origin";
}
map $upstream_http_permissions_policy $sec_permissions {
    default "";
    ""      "camera=(), microphone=(), payment=(), geolocation=()";
}
# Enforced: only what cannot break a page. The fuller policy is report-only,
# with no report endpoint, so it only logs in the browser until it is tightened.
map $upstream_http_content_security_policy $sec_csp {
    default "";
    ""      "frame-ancestors 'none'; object-src 'none'; base-uri 'self'";
}
map $upstream_http_content_security_policy_report_only $sec_csp_ro {
    default "";
    ""      "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; media-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
}

# An empty X-Forwarded-Proto is worse than a missing one: the descriptor
# builds its absolute URLs from it, and "" yields "://uain.global/mcp".
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

# Every copy of the connection server, with connections kept open. Without
# keepalive nginx opened a new connection for each request, and under load the
# copies' queues of new connections overflowed: the kernel dropped them and
# clients waited 1, 3, 7 s to retry (the k3s rehearsals of 2026-10-01).
# `resolve` asks Docker's DNS again every 10 s, as the variable used to: nginx
# starts while the pilot is down, and picks up the copies' new addresses after
# a deploy. "pilot" resolves to every copy, and nginx takes them in turn. One
# cost: started with no copy to find, nginx waits ~30 s to look again (the
# variable looked on every request). compose starts web only once the pilot
# is healthy, so that happens only if every copy dies while nginx runs on.
upstream pilot {
    zone pilot 64k;
    # Filled in at start (the image's 20-envsubst-on-templates): the
    # container's own DNS server, Docker's 127.0.0.11 or Kubernetes'
    # cluster DNS, and the copies' name, "pilot" under compose and the
    # Service's full name under k3s (deploy/k8s/production/web.yaml).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    server ${UAIN_PILOT_HOST}:8787 resolve;
    keepalive 64;
    keepalive_timeout 60s;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The pinned member verifier requires a JSON-RPC origin, without a path.
    # Only POST / reaches the bounded native gateway. GET/HEAD keep the homepage.
    location @native_public_rpc {
        client_max_body_size 96k;
        rewrite ^ /api/native/rpc break;
        proxy_pass http://pilot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 20s;
        # The site-wide header set (see the maps at the top of this file).
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
        add_header Cache-Control "no-store" always;
    }

    # Stream the qualified public verifier at a bounded rate; it remains outside
    # the web image and is checked against its exact pin by the pilot endpoint.
    location = /api/native/bootstrap/uain-state-linux-amd64 {
        limit_rate 4m;
        proxy_pass http://pilot;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
        # The site-wide header set (see the maps at the top of this file).
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
        add_header Cache-Control "no-store" always;
    }

    # Locations without an add_header of their own inherit these.
    # HSTS: the front door terminates TLS and sends it on every response
    # (deploy/k8s/production/front-door.conf); sending it here as well doubled
    # it on /mcp and /api/stream.
    add_header X-Content-Type-Options $sec_xcto always;
    add_header X-Frame-Options $sec_xfo always;
    add_header Referrer-Policy $sec_referrer always;
    add_header Permissions-Policy $sec_permissions always;
    add_header Content-Security-Policy $sec_csp always;
    add_header Content-Security-Policy-Report-Only $sec_csp_ro always;

    # The board ships ~2 MB of globe JS (globe.gl carries its own three.js), and
    # it was going out raw: 1.3 MB for globe.gl alone, ~2.3s on the wire, with
    # the front door on HTTP/1.1 so everything else queued behind it. gzip takes
    # that pair from 2,017 KB to 562 KB.
    #
    # gzip_static serves the .gz the image build already wrote at level 9;
    # gzip covers anything without a precompressed twin. Both are needed —
    # the static files have companions, proxied and generated ones do not.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        text/javascript
        application/json
        application/geo+json
        application/manifest+json
        text/css
        text/plain
        text/markdown
        image/svg+xml;

    # The connection server. MCP streams over a response that stays open, so
    # buffering must be off and the read timeout long, or sessions get cut.
    location /mcp {
        proxy_pass http://pilot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # The ledger as Server-Sent Events. One response held open for as long as
    # the client stays, so: no buffering, no gzip, a read timeout far above the
    # pilot's 25s heartbeat. X-Accel-Buffering is passed through because the
    # front door is nginx too, and without it that proxy buffers the stream.
    location = /api/stream {
        proxy_pass http://pilot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass_header X-Accel-Buffering;
        gzip off;
    }

    # The worker's installer and source. Served as text so a person can read
    # them in the browser before piping anything into a shell; as the default
    # octet-stream they would only download.
    location ^~ /worker/ {
        default_type text/plain;
        charset utf-8;
        # The site-wide header set (see the maps at the top of this file).
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
        add_header Cache-Control "no-cache" always;
    }

    # Campaign links (11 November 2026): uain.global/go/<code> and
    # /go/<code>/llms.txt are answered by BAINK, which keeps the posts, codes and
    # counts behind baink.money/admin (apps/baink/docs/campaigns.md). BAINK
    # serves them as /uain/go/<code>: the same code and count, with UAIN's guide
    # and page. A variable plus resolver, so nginx starts even when baink.money
    # cannot be resolved; browser and agent headers (Accept, User-Agent,
    # Sec-Fetch-*, Signature-Agent) pass through untouched, since BAINK picks
    # the page or the text guide from them.
    location ^~ /go/ {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
        set $baink_go https://baink.money;
        proxy_pass $baink_go/uain$uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name baink.money;
        proxy_set_header Host baink.money;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Badge URLs end in .svg but are live API reads, not static image files.
    location ^~ /api/badges/ {
        proxy_pass http://pilot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    # /api/status sets its own Cache-Control (the pilot always sends
    # public, max-age=30 on a 200). The no-store added to the rest of /api/
    # showed beside it as a second, contradictory header.
    location = /api/status {
        proxy_pass http://pilot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
        # The site-wide header set (see the maps at the top of this file).
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
    }

    location /api/ {
        proxy_pass http://pilot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
        # The site-wide header set (see the maps at the top of this file).
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
        add_header Cache-Control "no-store" always;
    }

    # Live task pages, feed and sitemap come from PostgreSQL, not the static
    # site export. Forward both the index and every task detail to the pilot.
    location = /tasks {
        proxy_pass http://pilot;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The site's header, footer and styles, spliced into the server's page
        # (services/pilot/src/api/record-frame.ts, scripts/record-frame.mjs).
        ssi on;
        # nginx's own refusals when the server does not answer, as a page.
        error_page 502 504 /_record-frame/unavailable.html;
    }
    location ^~ /tasks/ {
        proxy_pass http://pilot;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The site's header, footer and styles, spliced into the server's page
        # (services/pilot/src/api/record-frame.ts, scripts/record-frame.mjs).
        ssi on;
        # nginx's own refusals when the server does not answer, as a page.
        error_page 502 504 /_record-frame/unavailable.html;
    }

    # The site frame's fragments (10 November 2026): read only by the include
    # directives above (ssi subrequests are internal), never served on their
    # own. A missing fragment answers 204, so the include falls back to the
    # server's plain stub instead of splicing in the 404 page.
    location ^~ /_record-frame/ {
        internal;
        try_files $uri =204;
        # The site-wide header set (see the maps at the top of this file).
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
        add_header Cache-Control "no-store" always;
    }

    # ARD registries read this static catalog from other origins.
    location = /.well-known/ard.json {
        try_files $uri =404;
        # The site-wide header set (see the maps at the top of this file).
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Content-hashed filenames, so a cached copy can never be the wrong one.
    # Without this every repeat visit re-downloaded the globe.
    location /_next/static/ {
        try_files $uri =404;
        # The site-wide header set (see the maps at the top of this file).
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Country polygons for the globe. Not hashed, so revalidate daily rather
    # than pinning it for a year.
    location /geo/ {
        try_files $uri =404;
        # The site-wide header set (see the maps at the top of this file).
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Retired waitlist bookmarks go straight to current membership instructions.
    location ~ ^/waitlist(?:/|/index\.html|\.html)?$ {
        absolute_redirect off;
        # The site-wide header set (see the maps at the top of this file).
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
        add_header Vary Accept always;
        if ($http_accept ~* "text/markdown") {
            return 308 /access-guide.md$is_args$args;
        }
        return 308 /for-ai$is_args$args;
    }
    location = /waitlist.md {
        absolute_redirect off;
        return 308 /access-guide.md$is_args$args;
    }

    # Normalize real page aliases before static or dynamic routing.
    location ~ ^/(for-ai|try|waitlist|propose|insights|earth|editorial|network/projects|network/directory|records/projects|records/members)/$ {
        absolute_redirect off;
        return 308 /$1$is_args$args;
    }
    location ~ ^/(network/projects|network/directory)/([^/]+)/$ {
        absolute_redirect off;
        return 308 /$1/$2$is_args$args;
    }
    location ^~ /records/ {
        absolute_redirect off;
        rewrite ^(/records/(?:projects|members))/$ $1 permanent;
        proxy_pass http://pilot;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        # The site's header, footer and styles, spliced into the server's page
        # (services/pilot/src/api/record-frame.ts, scripts/record-frame.mjs).
        ssi on;
        # nginx's own refusals when the server does not answer, as a page.
        error_page 502 504 /_record-frame/unavailable.html;
    }

    # Crawlable member records come from the current public authority.
    location ~ ^/network/directory/(?<profile_id>[^/]+)/?$ {
        proxy_pass http://pilot;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        # The site's header, footer and styles, spliced into the server's page
        # (services/pilot/src/api/record-frame.ts, scripts/record-frame.mjs).
        ssi on;
        # nginx's own refusals when the server does not answer, as a page.
        error_page 502 504 /_record-frame/unavailable.html;
    }

    # Marketing project URLs retain their query string for referral attribution.
    location ~ ^/project/(?<project_alias>[^/]+)/?$ {
        absolute_redirect off;
        return 308 /network/projects/$project_alias$is_args$args;
    }
    location ~ ^/network/projects/(?<project_id>[^/]+)/?$ {
        proxy_pass http://pilot;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        # The site's header, footer and styles, spliced into the server's page
        # (services/pilot/src/api/record-frame.ts, scripts/record-frame.mjs).
        ssi on;
        # nginx's own refusals when the server does not answer, as a page.
        error_page 502 504 /_record-frame/unavailable.html;
    }


    location ~* \.(?:woff2|png|jpg|jpeg|gif|webp|svg|ico)$ {
        try_files $uri =404;
        # The site-wide header set (see the maps at the top of this file).
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Machine-readable Markdown guides.
    # nginx's default types do not know .md, so these went out as
    # octet-stream and a browser downloaded them instead of showing them.
    location ~* \.md$ {
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        try_files $uri =404;
        # The site-wide header set (see the maps at the top of this file).
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Vary Accept always;
    }

    # Serve the current joining guide when a machine requests Markdown.
    location = / {
        error_page 418 = @native_public_rpc;
        if ($request_method = POST) { return 418; }
        # The site-wide header set (see the maps at the top of this file).
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
        add_header Vary Accept always;
        add_header Link '</access-guide.md>; rel="alternate"; type="text/markdown"' always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        if ($http_accept ~* "text/markdown") {
            rewrite ^ /access-guide.md last;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        # HTML must never be pinned: it names the hashed assets, so a stale copy
        # would keep pointing a browser at the previous deploy's chunks.
        # The site-wide header set (see the maps at the top of this file).
        add_header X-Content-Type-Options $sec_xcto always;
        add_header X-Frame-Options $sec_xfo always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy $sec_permissions always;
        add_header Content-Security-Policy $sec_csp always;
        add_header Content-Security-Policy-Report-Only $sec_csp_ro always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
