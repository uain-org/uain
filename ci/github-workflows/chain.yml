name: UAIN sovereign chain
# Specialist qualification is operator-triggered, outside routine PR/deploy queues.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-chain:
    runs-on: [self-hosted, linux, x64, uain-production]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { persist-credentials: false }
      - name: Native race, persistence, gas, signatures and two-node smoke in an isolated container
        run: sudo /usr/local/sbin/uain-ci-run "$GITHUB_WORKSPACE" native-chain
  private-exchange:
    runs-on: [self-hosted, linux, x64, uain-production]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: { persist-credentials: false }
      - name: Pinned Orchard proofs, native race tests and private network smoke in an isolated container
        run: sudo /usr/local/sbin/uain-ci-run "$GITHUB_WORKSPACE" private-exchange
