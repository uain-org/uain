# Port 443 on uain-app-1, sorted by the name the visitor asked for (TLS SNI),
# before any TLS is opened. Installed as /etc/nginx/streams-enabled/sni.conf,
# included from nginx.conf's main context (stream module:
# libnginx-mod-stream). UAIN's TLS is ended by front-door.conf; AGA's
# passes through untouched to AGA's own nginx, certificates and all.
map $ssl_preread_server_name $sni_target {
    ~(^|\.)myaga\.org$  127.0.0.1:9443;
    kalki.now          127.0.0.1:9443;
    www.kalki.now      127.0.0.1:9443;
    default            127.0.0.1:8444;
}

server {
    listen 443;
    ssl_preread on;
    # The visitor's address travels in the PROXY protocol header; UAIN's
    # server reads it (front-door.conf), AGA's hop below drops it.
    proxy_protocol on;
    proxy_pass $sni_target;
}

# AGA's nginx does not speak the PROXY protocol: take the header off and pass
# the bytes on to AGA production's published TLS port.
server {
    listen 127.0.0.1:9443 proxy_protocol;
    proxy_pass 127.0.0.1:10443;
}
