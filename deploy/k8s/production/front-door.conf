# The front door on uain-app-1: nginx on the host terminates TLS for UAIN and
# proxies to the cluster's fixed Service addresses (uain.yaml). Installed as
# /etc/nginx/sites-enabled/uain; certificates in /etc/nginx/certs/uain.
# Ubuntu 24.04's nginx is 1.24: `listen ... http2`, not `http2 on` (1.25+).
#
# Port 443 belongs to front-door-sni.conf, which sorts connections by name:
# UAIN's come here, on 127.0.0.1:8444, with the PROXY protocol carrying the
# visitor's address; AGA's (myaga.org, kalki.now) go to AGA's own nginx.
# Port 80 is still here, and hands AGA's names to AGA on 127.0.0.1:10080.

# No "nginx/1.24.0 (Ubuntu)" in the Server header or on nginx's own error pages.
# The server and http contexts both allow it; this file is included in http.
server_tokens off;

set_real_ip_from 127.0.0.1;
real_ip_header proxy_protocol;

# One short line per response for UAIN's names, so nginx's own 502s and 504s
# are counted (ops/monitoring/host-probe -> uain_edge_* metrics). The servers
# below log here as well as to the usual access.log.
log_format uain_edge '$msec $host $status $upstream_status';

# Any other name (or the bare IP) gets nothing: an unknown host must not fall
# through to a site, as www.uain.global once fell through to AGA's.
server {
    listen 80 default_server;
    listen 127.0.0.1:8444 ssl http2 proxy_protocol default_server;
    ssl_reject_handshake on;
    return 444;
}

# AGA (production; it fronts its own staging names too) answers port 80 itself.
server {
    listen 80;
    server_name .myaga.org kalki.now www.kalki.now;
    location / {
        proxy_pass http://127.0.0.1:10080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name uain.global waitlist.uain.global www.uain.global;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:8444 ssl http2 proxy_protocol;
    server_name uain.global;
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/uain-edge.log uain_edge;
    ssl_certificate /etc/nginx/certs/uain/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/uain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://10.43.100.80:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MCP and the ledger stream hold a response open.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

# The waitlist dashboard, private, behind its own login.
server {
    listen 127.0.0.1:8444 ssl http2 proxy_protocol;
    server_name waitlist.uain.global;
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/uain-edge.log uain_edge;
    ssl_certificate /etc/nginx/certs/uain/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/uain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://10.43.100.82:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# www.uain.global redirects to the apex; the certificate covers it.
server {
    listen 127.0.0.1:8444 ssl http2 proxy_protocol;
    server_name www.uain.global;
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/uain-edge.log uain_edge;
    ssl_certificate /etc/nginx/certs/uain/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/uain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://uain.global$request_uri;
}
