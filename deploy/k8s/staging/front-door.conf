# staging.uain.global on uain-app-1's front door, installed as
# /etc/nginx/sites-enabled/uain-staging beside production's
# (../production/front-door.conf), which it does not touch. Port 443's sorter
# (front-door-sni.conf) already sends every name but AGA's to 127.0.0.1:8444.
# The certificate is production's, expanded to this name
# (certbot --cert-name uain.global --expand).

server {
    listen 80;
    server_name staging.uain.global;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:8444 ssl http2 proxy_protocol;
    server_name staging.uain.global;
    ssl_certificate /etc/nginx/certs/uain/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/uain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    # Not a place to be found by search engines or mistaken for the network.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://10.43.100.90:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
