# Independent test/staging stack. Never combine this file with compose.yaml.
name: uain-staging
services:
  web:
    image: uain-web-staging:${UAIN_IMAGE_TAG:-local}
    build: .
    ports:
      - '127.0.0.1:4200:8080'
    depends_on:
      pilot:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  pilot:
    image: uain-pilot-staging:${UAIN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/pilot/Dockerfile
    environment:
      DATABASE_URL: postgres://uain_staging:${POSTGRES_PASSWORD:?set a staging-only hexadecimal password}@db:5432/uain_staging
      UAIN_SYNAPSE_SHARED_SECRET: ${UAIN_SYNAPSE_SHARED_SECRET:-}
      UAIN_TRUSTED_PROXY_HOPS: '1'
      UAIN_TRANSFERS_ENABLED: 'false'
      # The image refuses to start without an authority (audit E-7), and this
      # test copy keeps accepting unbound sign-in proofs (E-8).
      UAIN_AUTHORITY: pilot
      UAIN_REQUIRE_BOUND_PROOFS: '0'
      # The origin sign-in proofs must name; the image refuses to start
      # without it (audit P2-7).
      UAIN_PUBLIC_ORIGIN: 'https://staging.uain.global'
    volumes:
      - staging-keys:/var/lib/uain-pilot
    depends_on:
      db:
        condition: service_healthy
    expose: ['8787']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: uain_staging
      POSTGRES_DB: uain_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a staging-only hexadecimal password}
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    command: ['postgres', '-c', 'shared_buffers=128MB', '-c', 'max_connections=50']
    volumes:
      - staging-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uain_staging -d uain_staging']
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
volumes:
  staging-db:
  staging-keys:
