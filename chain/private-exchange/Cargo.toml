[package]
name = "uain-private-exchange"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "uain-private-wallet"
path = "src/bin/uain-private-wallet.rs"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
orchard = { version = "=0.16.0", default-features = false, features = ["circuit", "std", "zeroize"] }
incrementalmerkletree = "=0.9.0"
nonempty = "=0.11.0"
sha2 = "=0.10.9"
rand = { version = "=0.10.0", features = ["std", "std_rng", "sys_rng"] }
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
ed25519-dalek = "=2.2.0"
zeroize = "=1.8.2"
libc = "=0.2.190"



[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
