[package]
name = "uain-private-dividend"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
halo2_proofs = { version = "=0.4.0", default-features = false }
pasta_curves = "=0.6.0"

[features]
default = []
public-hash-ffi = ["snapshot-prototype"]
snapshot-prototype = ["dep:halo2_gadgets", "dep:orchard", "dep:incrementalmerkletree", "dep:ed25519-dalek", "dep:sha2"]

[dependencies.halo2_gadgets]
version = "=0.6.0"
optional = true
[dependencies.orchard]
version = "=0.16.0"
default-features = false
features = ["circuit", "std", "unstable-voting-circuits"]
optional = true
[dependencies.incrementalmerkletree]
version = "=0.9.0"
optional = true

[dependencies.ed25519-dalek]
version = "=2.2.0"
optional = true

[dependencies.sha2]
version = "=0.10.9"
optional = true

[dev-dependencies]
num-bigint = "=0.4.8"
rand = { version = "=0.10.0", features = ["std", "std_rng"] }
